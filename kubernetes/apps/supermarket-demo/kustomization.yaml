# Synchronisé par Argo CD (Application supermarket-demo). La configuration de l'agent Java OTel reste le
# fichier versionné default/otel/agent.yaml (relu par make trace-context-verify) : Kustomize en
# recopie le contenu dans spec.otel.agentConfig de chaque Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application.yaml
configMapGenerator:
  - name: otel-agent-config-source
    files:
      - agent=default/otel/agent.yaml
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
replacements:
  - source: {kind: ConfigMap, name: otel-agent-config-source, fieldPath: data.agent}
    targets:
      - select: {kind: Application}
        fieldPaths: [spec.otel.agentConfig]
        options: {create: true}

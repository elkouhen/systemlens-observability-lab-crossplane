# k3s-01 : cluster applicatif k3s (services Java, PostgreSQL, MongoDB, Kafka métier et OTel,
# Collecteur Edge et collecteurs OTel), piloté depuis le hub tools-01.
base: ./base.yaml
# 4 vCPU : trois JVM, deux Kafka, PostgreSQL et MongoDB saturent 2 vCPU au démarrage
# (sondes de vivacité en échec, redémarrages en chaîne).
cpus: 4
# 6 Gio pour environ 4,9 Gio utilisés (budget mémoire : README de l'architecture).
memory: 6GiB
disk: 60GiB
ssh:
  localPort: 2255
param:
  HOSTNAME: k3s-01
  NODE_IP: 192.168.33.50
portForwards:
  # API Kubernetes (.kube/k3s.config), sur le port 6444 de l'hôte : 6443 est celui du hub.
  - {guestPort: 6443, hostPort: 6444, hostIP: 127.0.0.1}
  # Collecteur Edge (ports du nœud ouverts par le pod otel-edge (réseau de l'hôte)) : OTLP depuis le poste (make otel-validate).
  - {guestPort: 4317, hostPort: 4317, hostIP: 127.0.0.1}
  - {guestPort: 4318, hostPort: 4318, hostIP: 127.0.0.1}
  - guestPortRange: [1, 65535]
    ignore: true

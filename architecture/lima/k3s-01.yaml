# k3s-01 : nom, IP privée, mémoire et disque de la VM
base: ./base.yaml
memory: 8GiB
disk: 60GiB
ssh:
  localPort: 2255
param:
  HOSTNAME: k3s-01
  NODE_IP: 192.168.33.50
portForwards:
  - {guestPort: 6443, hostIP: 127.0.0.1}
  - {guestPort: 80, hostPort: 8080, hostIP: 127.0.0.1}
  - {guestPort: 443, hostPort: 8443, hostIP: 127.0.0.1}
  - guestPortRange: [1, 65535]
    ignore: true

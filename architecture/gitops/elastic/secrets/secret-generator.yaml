# Secrets du groupe elastic, chiffrés par SOPS (age) ; liste tenue à jour par make secrets-encrypt.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: elastic-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - elastic-terraform.sops.yaml
  - elasticsearch-es-elastic-user.sops.yaml
  - kibana-auth.sops.yaml

# Configuration déclarative de l'agent Java OpenTelemetry 2.28.1 de demo-api
# (OTEL_CONFIG_FILE), même forme que celle des services supermarché. Seules
# les valeurs substituées ${...} viennent de l'environnement du pod. Schéma :
# https://github.com/open-telemetry/opentelemetry-configuration
file_format: "1.0"

# Identité du pod : service.name, plateforme, environnement, cluster,
# namespace, pod et nœud viennent de OTEL_RESOURCE_ATTRIBUTES du patch
# d'instrumentation (ADR-020).
resource:
  attributes:
    - name: service.version
      value: 1.1.0
  attributes_list: ${OTEL_RESOURCE_ATTRIBUTES}

propagator:
  composite:
    - tracecontext:
    - baggage:

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://otel-edge-vm.elastic-stack.svc.cluster.local:4318/v1/traces
            headers_list: ${OTEL_EXPORTER_OTLP_HEADERS}

# Métriques de l'agent : runtime JVM et http.server.request.duration, lues
# par l'onglet Metrics de l'UI APM.
meter_provider:
  readers:
    - periodic:
        interval: 15000
        exporter:
          otlp_http:
            endpoint: http://otel-edge-vm.elastic-stack.svc.cluster.local:4318/v1/metrics
            headers_list: ${OTEL_EXPORTER_OTLP_HEADERS}

# Logs Logback exportés en OTLP natif, corrélés aux traces (ADR-012).
logger_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://otel-edge-vm.elastic-stack.svc.cluster.local:4318/v1/logs
            headers_list: ${OTEL_EXPORTER_OTLP_HEADERS}

instrumentation/development:
  java:
    # Métriques JVM expérimentales : jvm.system.cpu.utilization,
    # jvm.buffer.memory.used.
    runtime_telemetry:
      emit_experimental_metrics/development: true

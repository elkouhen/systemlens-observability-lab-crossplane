# Secrets du groupe supermarket, chiffrés par SOPS (age) ; liste tenue à jour par make secrets-encrypt.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: supermarket-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets/kafka-business.sops.yaml
  - secrets/mongodb-terraform.sops.yaml
  - secrets/otel-edge-client-keys.sops.yaml
  - secrets/postgresql-admin.sops.yaml
  - secrets/postgresql-credentials.sops.yaml
  - secrets/postgresql-otel.sops.yaml

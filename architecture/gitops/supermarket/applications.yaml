# Les trois services du scénario supermarché, déclarés comme des Application Crossplane
# (gitops/crossplane/apis/application). La Composition produit leur Deployment, leur Service et
# leur instrumentation OTel dans k3s-01. Leurs back-ends (databases.yaml) sont dans le même
# namespace de k3s-01 : Services kafka-bootstrap de Strimzi, rw de CloudNativePG, Secret de
# connexion de MongoDB. Synchronisé par Argo CD depuis Git (kustomization.yaml injecte
# otel-agent.yaml) ; changer un tag ici, puis committer et pousser, redéploie le service.
#
# Niveaux de log (ADR-012) : les logs OTel doivent porter le trace_id du traitement qui les émet.
# Seuls les loggers applicatifs (io.systemlens) restent en INFO ; les frameworks (Spring, Tomcat,
# client Kafka, Flyway, Hikari, Micrometer) n'émettent qu'à partir de WARN, hors de toute requête.
# make observability-schema-verify contrôle cette règle.
---
apiVersion: apps.lab.io/v1alpha1
kind: Application
metadata:
  name: order-service
  namespace: h0tl-supermarche-app
spec:
  image: {name: order-service, tag: 1.1.6}
  port: 3000
  probePath: /api/health
  otel:
    platform: supermarche
    micrometerMetrics: true
  env:
    - {name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "supermarket-kafka-kafka-bootstrap:9092"}
    - {name: ORDER_SERVICE_INVENTORY_SERVICE_URL, value: "http://inventory-service:3001"}
    - {name: LOGGING_LEVEL_ROOT, value: WARN}
    - {name: LOGGING_LEVEL_IO_SYSTEMLENS, value: INFO}
---
apiVersion: apps.lab.io/v1alpha1
kind: Application
metadata:
  name: inventory-service
  namespace: h0tl-supermarche-app
spec:
  image: {name: inventory-service, tag: 1.1.6}
  port: 3001
  probePath: /api/health
  otel:
    platform: supermarche
    micrometerMetrics: true
  env:
    - name: SPRING_DATA_MONGODB_URI
      valueFrom:
        secretKeyRef: {name: supermarket-mongodb-observability, key: connectionString.standard}
    # La chaîne de connexion désigne la base d'authentification (admin).
    - {name: SPRING_DATA_MONGODB_DATABASE, value: observability_test}
    - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://supermarket-postgresql-rw:5432/observability_test"}
    - {name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "supermarket-kafka-kafka-bootstrap:9092"}
    - {name: SPRING_DATASOURCE_USERNAME, value: observability}
    - name: SPRING_DATASOURCE_PASSWORD
      valueFrom:
        secretKeyRef: {name: supermarket-postgresql-owner, key: password}
    - {name: LOGGING_LEVEL_ROOT, value: WARN}
    - {name: LOGGING_LEVEL_IO_SYSTEMLENS, value: INFO}
---
apiVersion: apps.lab.io/v1alpha1
kind: Application
metadata:
  name: restock-service
  namespace: h0tl-supermarche-app
spec:
  image: {name: restock-service, tag: 1.1.6}
  port: 3002
  probePath: /actuator/health
  otel:
    platform: supermarche
    micrometerMetrics: true
  env:
    - {name: SPRING_KAFKA_BOOTSTRAP_SERVERS, value: "supermarket-kafka-kafka-bootstrap:9092"}
    - {name: LOGGING_LEVEL_ROOT, value: WARN}
    - {name: LOGGING_LEVEL_IO_SYSTEMLENS, value: INFO}

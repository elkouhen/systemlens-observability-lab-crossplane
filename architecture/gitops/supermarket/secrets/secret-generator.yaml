# Secrets du groupe supermarket, chiffrés par SOPS (age) ; liste tenue à jour par make secrets-encrypt.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: supermarket-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - kafka-business.sops.yaml
  - mongodb-credentials.sops.yaml
  - mongodb-terraform.sops.yaml
  - otel-edge-client-keys.sops.yaml
  - postgresql-admin.sops.yaml
  - postgresql-credentials.sops.yaml
  - postgresql-otel.sops.yaml

# Groupe supermarché (Application Argo CD supermarket, synchronisée dans le hub) : les trois
# services Java (Application Crossplane) et leurs back-ends dans k3s-01 (PostgreSQLInstance,
# MongoDBInstance, KafkaCluster), leur configuration (provider-sql, Terraform, provider-kafka) et
# leurs Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets-app.yaml
  - namespace.yaml
  - target.yaml
  - databases.yaml
  - applications.yaml
  - postgresql.yaml
  - mongodb.yaml
  - kafka-topics.yaml
configMapGenerator:
  # Configuration de l'agent Java OTel (otel-agent.yaml, relue par make trace-context-verify),
  # recopiée dans spec.otel.agentConfig de chaque Application puis retirée du rendu.
  - name: otel-agent-config-source
    files:
      - agent=otel-agent.yaml
    options:
      disableNameSuffixHash: true
      annotations: {config.kubernetes.io/local-config: "true"}
replacements:
  - source: {kind: ConfigMap, name: otel-agent-config-source, fieldPath: data.agent}
    targets:
      - select: {group: apps.lab.io, kind: Application}
        fieldPaths: [spec.otel.agentConfig]
        options: {create: true}

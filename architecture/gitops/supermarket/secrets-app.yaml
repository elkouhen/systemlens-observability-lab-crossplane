# Secrets SOPS du groupe (secrets/), rendus par le plugin ksops dans une Application imbriquée.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supermarket-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elkouhen/systemlens-observability-lab-crossplane.git
    targetRevision: main
    path: architecture/gitops/supermarket/secrets
    plugin: {name: ksops}
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 30
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}

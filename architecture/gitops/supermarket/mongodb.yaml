# Supervision MongoDB (instance supermarket-mongodb de k3s-01, databases.yaml), déclarée (provider
# Terraform Kaginari/mongodb) : compte otel_monitor du receiver mongodb du collecteur
# otel-middleware (gitops/otel-pipeline/k3s-01).
---
# MongoDB par le NodePort 30017 de k3s-01 via Terraform : compte crossplane_admin déclaré par
# l'instance (MongoDBInstance) ; état Terraform dans des Secrets du hub.
apiVersion: tf.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: mongodb
spec:
  pluginCache: true
  credentials:
    - filename: crossplane-mongodb.auto.tfvars.json
      source: Secret
      secretRef: {namespace: crossplane-system, name: mongodb-terraform, key: tfvars}
  configuration: |
    terraform {
      required_providers {
        mongodb = {
          source  = "Kaginari/mongodb"
          version = "~> 1.0"
        }
      }
      backend "kubernetes" {
        secret_suffix     = "mongodb"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }
    variable "mongodb_admin_password" {
      type      = string
      sensitive = true
    }
    variable "otel_monitor_password" {
      type      = string
      sensitive = true
    }
    provider "mongodb" {
      host          = "192.168.33.50"
      port          = "30017"
      username      = "crossplane_admin"
      password      = var.mongodb_admin_password
      auth_database = "admin"
      direct        = true
    }
---
apiVersion: tf.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: mongodb-monitoring
  namespace: crossplane-system
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: mongodb}
  forProvider:
    source: Inline
    module: |
      resource "mongodb_db_user" "otel_monitor" {
        auth_database = "admin"
        name          = "otel_monitor"
        password      = var.otel_monitor_password
        role {
          role = "clusterMonitor"
          db   = "admin"
        }
      }

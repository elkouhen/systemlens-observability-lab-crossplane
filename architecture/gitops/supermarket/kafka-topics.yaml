# Topics métier du Kafka supermarket-kafka de k3s-01 (databases.yaml).
---
# Kafka métier par le NodePort 31192 de k3s-01 : PLAINTEXT sans authentification, comme dans le lab
apiVersion: kafka.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: kafka-business
spec:
  credentials:
    source: Secret
    secretRef: {namespace: crossplane-system, name: kafka-business, key: credentials}
---
apiVersion: topic.kafka.m.crossplane.io/v1alpha1
kind: Topic
metadata:
  name: supermarket.order.placed
  namespace: crossplane-system
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kafka-business}
  forProvider:
    partitions: 1
    replicationFactor: 1
    config:
      min.insync.replicas: "1"
      cleanup.policy: delete
      retention.ms: "86400000"
      retention.bytes: "536870912"
      segment.ms: "3600000"
      segment.bytes: "67108864"
---
apiVersion: topic.kafka.m.crossplane.io/v1alpha1
kind: Topic
metadata:
  name: supermarket.stock.depleted
  namespace: crossplane-system
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kafka-business}
  forProvider:
    partitions: 1
    replicationFactor: 1
    config:
      min.insync.replicas: "1"
      cleanup.policy: delete
      retention.ms: "86400000"
      retention.bytes: "536870912"
      segment.ms: "3600000"
      segment.bytes: "67108864"
---
apiVersion: topic.kafka.m.crossplane.io/v1alpha1
kind: Topic
metadata:
  name: supermarket.stock.restock-requested
  namespace: crossplane-system
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kafka-business}
  forProvider:
    partitions: 1
    replicationFactor: 1
    config:
      min.insync.replicas: "1"
      cleanup.policy: delete
      retention.ms: "86400000"
      retention.bytes: "536870912"
      segment.ms: "3600000"
      segment.bytes: "67108864"

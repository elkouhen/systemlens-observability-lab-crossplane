# Secrets du groupe otel-pipeline, chiffrés par SOPS (age) et déchiffrés par le plugin ksops d'Argo CD
# (Application otel-pipeline-secrets, secrets-app.yaml du groupe). Rendu à part : le kustomize de l'image
# KSOPS (v5.3) ignorerait les ressources dont le type finit par « List » (AccessControlList).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generators:
  - secret-generator.yaml

# Secrets du groupe otel-pipeline, chiffrés par SOPS (age) ; liste tenue à jour par make secrets-encrypt.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: otel-pipeline-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets/kafka-otel-accounts.sops.yaml
  - secrets/kafka-otel-admin.sops.yaml
  - secrets/otel-edge-client-keys.sops.yaml

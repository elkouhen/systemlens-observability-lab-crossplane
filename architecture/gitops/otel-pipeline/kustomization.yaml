# Chaîne OTel (Application Argo CD otel-pipeline, synchronisée dans le hub) : Kafka OTel de k3s-01
# (KafkaCluster), registre des plateformes, comptes SCRAM et ACL (provider-kafka), Secrets des
# collecteurs recopiés dans k3s-01, et l'Application imbriquée otel-pipeline-k3s-01 (k3s-01/ :
# Service vers le Collecteur Edge, collecteurs OTel).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets-app.yaml
  - k3s-01-app.yaml
  - kafka.yaml
  - platforms.yaml
  - kafka-accounts.yaml
  - target.yaml

# Groupe supermarché : services Java et leurs bases PostgreSQL, MongoDB et Kafka métier.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supermarket
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elkouhen/systemlens-observability-lab-crossplane.git
    targetRevision: main
    path: architecture/gitops/supermarket
    # kustomize build avec le générateur KSOPS (Secrets SOPS du groupe), voir install/cmp-ksops.yaml.
    plugin: {name: ksops}
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - ServerSideApply=true
      # Les ressources dont la CRD n'existe pas encore (XRD, providers) passent au retry suivant.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}

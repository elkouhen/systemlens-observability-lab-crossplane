# Installation d'Argo CD dans le hub tools-01 (make argocd-install), amorcée hors GitOps.
# Manifeste amont épinglé, plus trois adaptations au lab :
# - plugin sidecar ksops (repo-server.yaml, cmp-ksops.yaml), utilisé par les Application
#   <groupe>-secrets pour déchiffrer les Secrets SOPS des groupes (clé age : Secret sops-age) ;
# - interface en HTTP derrière Traefik : http://argocd.localhost:8080 ;
# - bundle CA du nœud du hub (racine du proxy TLS d'entreprise comprise) monté dans le repo-server
#   (repo-server.yaml), pour GitHub et les dépôts Helm.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.7/manifests/install.yaml
  - ingress.yaml
  - cmp-ksops.yaml
patches:
  - path: repo-server.yaml
  - target: {kind: ConfigMap, name: argocd-cm}
    patch: |
      - op: add
        path: /data
        value:
          # Objets de comptage créés par Crossplane à chaque usage d'une ProviderConfig : ni
          # versionnés ni utiles à l'état des applications.
          resource.exclusions: |
            - apiGroups: ["*"]
              kinds: ["ProviderConfigUsage", "ClusterProviderConfigUsage"]
              clusters: ["*"]
  - target: {kind: ConfigMap, name: argocd-cmd-params-cm}
    patch: |
      - op: add
        path: /data
        value:
          server.insecure: "true"

# ECK 3.5.0 (Elasticsearch, Kibana, Elastic Agent), dans elk-01 : instance ObservabilityStack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-elk-01
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 3.5.0
    helm:
      valuesObject:
        resources:
          requests: {cpu: 100m, memory: 150Mi}
          limits: {memory: 384Mi}
  destination: {name: elk-01, namespace: elastic-system}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 30
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}

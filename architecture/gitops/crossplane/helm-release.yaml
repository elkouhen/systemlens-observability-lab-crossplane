# Crossplane lui-même : chart Helm officiel, installé et maintenu par Argo CD (Application imbriquée
# dans le groupe crossplane). Le ConfigMap ca-bundle (bundle CA du hub tools-01, racine du proxy TLS
# d'entreprise comprise) est déposé par make crossplane-ca-apply : il dépend du poste.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.4.3
    helm:
      valuesObject:
        registryCaBundleConfig: {name: ca-bundle, key: ca-certificates.crt}
        # Cache des paquets dans le cache local de l'hôte (install/package-cache.yaml).
        packageCache: {pvc: crossplane-package-cache}
  destination: {server: https://kubernetes.default.svc, namespace: crossplane-system}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry:
      limit: 30
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}

# Socle Crossplane synchronisé par Argo CD (Application crossplane) :
#   helm-release.yaml   : Crossplane (chart Helm officiel), Application Argo CD imbriquée ;
#   install/            : cache des paquets, providers et fonctions, runtime et RBAC des providers ;
#   apis/application    : Application, un service Java instrumenté (Deployment, Service, agent OTel) ;
#   apis/otel-platform  : OtelPlatform, une plateforme OTel (topics Kafka, ACL des publishers).
# Les ressources dont la CRD n'existe pas encore (Provider avant Crossplane, XR avant leur XRD)
# passent au retry suivant de l'Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - install/package-cache.yaml
  - install/packages.yaml
  - install/runtime.yaml
  - apis/application/definition.yaml
  - apis/application/composition.yaml
  - apis/otel-platform/definition.yaml
  - apis/otel-platform/composition.yaml

# Une application du lab : un service Java instrumenté par l'agent OTel, exposé dans son namespace.
# La Composition (composition.yaml) en produit le Deployment, le Service et la configuration de
# l'agent OTel dans le cluster cible (spec.cluster, k3s-01 par défaut). Les instances sont déclarées avec chaque application
# (architecture/gitops/<groupe>/application.yaml) et synchronisées par Argo CD ; Kustomize y
# injecte la configuration de l'agent (architecture/gitops/<groupe>/kustomization.yaml).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: applications.apps.lab.io
spec:
  scope: Namespaced
  group: apps.lab.io
  names:
    kind: Application
    plural: applications
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      additionalPrinterColumns:
        - {name: IMAGE, type: string, jsonPath: .status.image}
        - {name: PLATFORM, type: string, jsonPath: .spec.otel.platform}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [image, port, otel]
              properties:
                image:
                  type: object
                  required: [name, tag]
                  properties:
                    registry:
                      type: string
                      default: ghcr.io/elkouhen/systemlens-observability-lab-crossplane
                      description: >-
                        Registre de l'image, alimenté par le workflow GitHub build-images.yml.
                        Vide : image locale importée dans k3s (make apps-build images-import).
                    name: {type: string}
                    tag: {type: string}
                cluster:
                  type: string
                  default: k3s-01
                  description: Cluster cible (ClusterProviderConfig de provider-kubernetes du même nom).
                port:
                  type: integer
                  description: Port HTTP du conteneur, repris par le Service.
                probePath:
                  type: string
                  description: Chemin HTTP des sondes ; sans valeur, sondes TCP sur le port.
                memoryLimit:
                  type: string
                  default: 512Mi
                env:
                  type: array
                  description: Variables propres au service, ajoutées après celles de l'instrumentation OTel.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                otel:
                  type: object
                  required: [platform, agentConfig]
                  properties:
                    platform:
                      type: string
                      description: platform.id (ADR-020), qui choisit le topic Kafka OTel de l'Edge.
                    environment:
                      type: string
                      default: homologation
                    clusterName:
                      type: string
                      default: k3s-01
                    edgeEndpoint:
                      type: string
                      default: http://otel-edge-vm.elastic-stack.svc.cluster.local:4318
                    micrometerMetrics:
                      type: boolean
                      default: false
                      description: Export OTLP des métriques métier Micrometer vers l'Edge.
                    agentConfig:
                      type: string
                      description: Configuration déclarative de l'agent Java OTel (OTEL_CONFIG_FILE).
            status:
              type: object
              properties:
                image: {type: string}

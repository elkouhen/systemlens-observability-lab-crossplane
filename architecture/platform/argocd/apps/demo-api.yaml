# Application Crossplane de demo-api.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/elkouhen/systemlens-observability-lab-crossplane.git
    targetRevision: main
    path: kubernetes/apps/demo-api
  destination: {server: https://kubernetes.default.svc}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - ServerSideApply=true
      # Les ressources dont la CRD n'existe pas encore (XRD, providers) passent au retry suivant.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}

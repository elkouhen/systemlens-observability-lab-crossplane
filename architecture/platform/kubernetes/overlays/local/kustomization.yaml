apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/observability
patches:
  # Synchronisé par Argo CD (Application platform-kubernetes) : le namespace porte aussi des
  # ressources hors de cette application (Workspace elasticsearch, Secrets, ConfigMap) et n'est
  # jamais supprimé par un élagage.
  - target: {kind: Namespace, name: elastic-stack}
    patch: |
      - op: add
        path: /metadata/annotations
        value: {argocd.argoproj.io/sync-options: Delete=false}

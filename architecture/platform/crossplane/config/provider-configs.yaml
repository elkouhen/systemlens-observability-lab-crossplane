# Accès des providers aux back-ends du lab. Les Secrets référencés sont créés hors Git par
# scripts/credentials.sh à partir de .observability-credentials.env (seule étape impérative).
---
# Kafka OTel (otel-backend-01) : otel_admin, super-utilisateur amorcé par Ansible (SASL/PLAIN)
apiVersion: kafka.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: kafka-otel
spec:
  credentials:
    source: Secret
    secretRef: {namespace: crossplane-system, name: kafka-otel-admin, key: credentials}
---
# Kafka métier (supermarket-middleware-01) : PLAINTEXT sans authentification, comme dans le lab
apiVersion: kafka.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: kafka-business
spec:
  credentials:
    source: Secret
    secretRef: {namespace: crossplane-system, name: kafka-business, key: credentials}
---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: postgresql
spec:
  sslMode: disable
  defaultDatabase: observability_test
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef: {namespace: crossplane-system, name: postgresql-admin}
---
# Elasticsearch, Kibana et Fleet (elk-01) via Terraform ; état stocké dans des Secrets
apiVersion: tf.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: elastic
spec:
  pluginCache: true
  credentials:
    - filename: crossplane-elastic.auto.tfvars.json
      source: Secret
      secretRef: {namespace: crossplane-system, name: elastic-terraform, key: tfvars}
  configuration: |
    terraform {
      required_providers {
        elasticstack = {
          source  = "elastic/elasticstack"
          version = "~> 0.17.0"
        }
      }
      backend "kubernetes" {
        secret_suffix     = "elastic"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }
    variable "elastic_password" {
      type      = string
      sensitive = true
    }
    provider "elasticstack" {
      elasticsearch {
        endpoints = ["http://192.168.33.40:9200"]
        username  = "elastic"
        password  = var.elastic_password
      }
      kibana {
        endpoints = ["http://192.168.33.40:5601"]
        username  = "elastic"
        password  = var.elastic_password
      }
      fleet {
        endpoint = "http://192.168.33.40:5601"
        username = "elastic"
        password = var.elastic_password
      }
    }
---
# Kibana en HTTP brut : l'en-tête Basic est lu dans le Secret kibana-auth au moment de l'appel
apiVersion: http.m.crossplane.io/v1alpha2
kind: ClusterProviderConfig
metadata:
  name: kibana
spec:
  credentials:
    source: None
---
# Objets Kubernetes de k3s-01 : provider-kubernetes agit sur son propre cluster avec son
# ServiceAccount (install/runtime.yaml).
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: ClusterProviderConfig
metadata:
  name: kubernetes
spec:
  credentials:
    source: InjectedIdentity
---
# MongoDB (supermarket-middleware-01) via Terraform : compte crossplane_admin amorcé par Ansible
# (MongoDB tourne sans --auth, mais le provider s'authentifie toujours) ; état dans des Secrets.
apiVersion: tf.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: mongodb
spec:
  pluginCache: true
  credentials:
    - filename: crossplane-mongodb.auto.tfvars.json
      source: Secret
      secretRef: {namespace: crossplane-system, name: mongodb-terraform, key: tfvars}
  configuration: |
    terraform {
      required_providers {
        mongodb = {
          source  = "Kaginari/mongodb"
          version = "~> 1.0"
        }
      }
      backend "kubernetes" {
        secret_suffix     = "mongodb"
        namespace         = "crossplane-system"
        in_cluster_config = true
      }
    }
    variable "mongodb_admin_password" {
      type      = string
      sensitive = true
    }
    variable "otel_monitor_password" {
      type      = string
      sensitive = true
    }
    provider "mongodb" {
      host          = "192.168.33.10"
      port          = "27017"
      username      = "crossplane_admin"
      password      = var.mongodb_admin_password
      auth_database = "admin"
      direct        = true
    }

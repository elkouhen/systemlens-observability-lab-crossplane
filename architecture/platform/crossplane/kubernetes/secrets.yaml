# Namespaces applicatifs et Secrets consommés par les workloads de k3s-01 (provider-kubernetes).
# Remplace les `kubectl create secret` du Makefile (cibles otel-edge-client-keys-apply,
# postgresql-credentials-apply et création de elasticsearch-es-elastic-user dans elk-deploy).
# Les valeurs sont copiées (references.patchesFrom) depuis le Secret source unique
# crossplane-system/lab-secrets, déposé par scripts/credentials.sh. Un Secret supprimé ou modifié
# à la main est recréé ou réaligné.
---
# Namespace des services supermarché (Application order, inventory et restock-service).
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: namespace-h0tl-supermarche-app
  namespace: crossplane-system
  labels: {lab.io/managed-by: kubernetes-secrets}
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kubernetes}
  # Jamais supprimé par Crossplane : le namespace porte aussi les workloads applicatifs.
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: h0tl-supermarche-app
---
# Un namespace est une plateforme dans un environnement (ADR-015) : h0tl-demo-app héberge la
# plateforme demo en homologation, que chaque pod déclare par platform.id et
# deployment.environment.name (ADR-020).
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: namespace-h0tl-demo-app
  namespace: crossplane-system
  labels: {lab.io/managed-by: kubernetes-secrets}
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kubernetes}
  # Jamais supprimé par Crossplane : le namespace porte aussi les workloads applicatifs.
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  forProvider:
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: h0tl-demo-app
---
# Clés Bearer des clients OTLP de l'Edge (ADR-015) : collecteurs Kubernetes et applications.
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: secret-elastic-stack-otel-edge-client-keys
  namespace: crossplane-system
  labels: {lab.io/managed-by: kubernetes-secrets}
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kubernetes}
  watch: true
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: lab-secrets
        namespace: crossplane-system
        fieldPath: data[otel-kubernetes]
      toFieldPath: data[otel-kubernetes]
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: lab-secrets
        namespace: crossplane-system
        fieldPath: data[otel-kubernetes-cluster]
      toFieldPath: data[otel-kubernetes-cluster]
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: otel-edge-client-keys
        namespace: elastic-stack
      type: Opaque
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: secret-h0tl-supermarche-app-otel-edge-client-keys
  namespace: crossplane-system
  labels: {lab.io/managed-by: kubernetes-secrets}
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kubernetes}
  watch: true
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: lab-secrets
        namespace: crossplane-system
        fieldPath: data[otel-kubernetes]
      toFieldPath: data[otel-kubernetes]
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: lab-secrets
        namespace: crossplane-system
        fieldPath: data[otel-kubernetes-cluster]
      toFieldPath: data[otel-kubernetes-cluster]
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: otel-edge-client-keys
        namespace: h0tl-supermarche-app
      type: Opaque
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: secret-h0tl-demo-app-otel-edge-client-keys
  namespace: crossplane-system
  labels: {lab.io/managed-by: kubernetes-secrets}
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: kubernetes}
  watch: true
  references:
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: lab-secrets
        namespace: crossplane-system
        fieldPath: data[otel-kubernetes]
      toFieldPath: data[otel-kubernetes]
    - patchesFrom:
        apiVersion: v1
        kind: Secret
        name: lab-secrets
        namespace: crossplane-system
        fieldPath: data[otel-kubernetes-cluster]
      toFieldPath: data[otel-kubernetes-cluster]
  forProvider:
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: otel-edge-client-keys
        namespace: h0tl-demo-app
      type: Opaque
---

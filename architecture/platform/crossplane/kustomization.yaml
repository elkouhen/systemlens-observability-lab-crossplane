# Configuration Crossplane des back-ends, synchronisée par Argo CD (Application crossplane-config).
# install/ (paquets, runtime) est amorcé par make crossplane-install ; secrets/ est une Application
# Argo CD distincte (Secrets chiffrés par SOPS).
# Les fichiers de platform/elk restent la source de vérité : Kustomize les publie tels quels
# (--load-restrictor LoadRestrictionsNone, réglé dans argocd-cm et dans make kubernetes-validate).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config/provider-configs.yaml
  - kafka-otel/definition.yaml
  - kafka-otel/composition.yaml
  - kafka-otel/accounts.yaml
  - platforms.yaml
  - applications/definition.yaml
  - applications/composition.yaml
  - kafka-business/topics.yaml
  - postgresql/monitoring.yaml
  - mongodb/monitoring.yaml
  - elastic/elasticsearch.yaml
  - elastic/fleet.yaml
  - elastic/kibana.yaml
  - elastic/kibana-alerting.yaml
  - elastic/dashboards.yaml
  - kubernetes/secrets.yaml
configMapGenerator:
  # Lus par les Workspaces Terraform (variables TF_VAR_* de spec.forProvider.env).
  - name: elastic-assets
    namespace: elastic-stack
    files:
      - ../elk/ilm/retention.json
      - ../elk/fleet/kafka-raft-pipeline.json
      - ../elk/fleet/kafka-topic-ingest-pipeline.json
  - name: elastic-assets
    namespace: crossplane-system
    files:
      - ../elk/dashboards/apm-data-view.ndjson
      - ../elk/alerts/observability-policies.json
  # Source locale des dashboards, recopiée dans les Request puis retirée du rendu.
  - name: kibana-dashboards
    namespace: crossplane-system
    files:
      - business-metrics-dashboard=../elk/dashboards/business-metrics-dashboard.json
      - otel-flow-health-dashboard=../elk/dashboards/otel-flow-health-dashboard.json
    options:
      annotations: {config.kubernetes.io/local-config: "true"}
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source: {kind: ConfigMap, name: kibana-dashboards, fieldPath: data.business-metrics-dashboard}
    targets:
      - select: {kind: Request, name: dashboard-business-metrics-dashboard}
        fieldPaths: [spec.forProvider.payload.body]
  - source: {kind: ConfigMap, name: kibana-dashboards, fieldPath: data.otel-flow-health-dashboard}
    targets:
      - select: {kind: Request, name: dashboard-otel-flow-health-dashboard}
        fieldPaths: [spec.forProvider.payload.body]

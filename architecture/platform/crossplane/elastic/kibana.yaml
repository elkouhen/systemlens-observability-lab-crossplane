# Saved objects Kibana exportés en NDJSON (data view APM), importés par Terraform.
# Remplace make apm-data-view-deploy. Les règles d'alerte sont dans kibana-alerting.yaml ; les
# dashboards décrits en JSON brut sont gérés par provider-http (elastic/dashboards.yaml).
apiVersion: tf.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: kibana-saved-objects
  namespace: crossplane-system
spec:
  providerConfigRef: {kind: ClusterProviderConfig, name: elastic}
  forProvider:
    source: Inline
    env:
      - name: TF_VAR_apm_data_view
        configMapKeyRef: {name: elastic-assets, key: apm-data-view.ndjson}
    module: |
      # NDJSON versionné, transmis tel quel (TF_VAR_* depuis le ConfigMap elastic-assets).
      variable "apm_data_view" { type = string }
      locals {
        saved_objects = { "apm-data-view" = var.apm_data_view }
      }

      resource "elasticstack_kibana_import_saved_objects" "ndjson" {
        for_each      = local.saved_objects
        file_contents = each.value
        overwrite     = true
      }

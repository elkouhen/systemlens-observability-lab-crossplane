---
- name: Provisionner les VM de la plateforme architecture
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: retention

# Serveurs k3s : hub tools-01 et clusters cibles k3s-01 et elk-01. Tout ce qui tourne dans ces
# clusters est déployé ensuite par Argo CD et Crossplane depuis le hub (make deploy).
- name: Déployer les serveurs k3s
  hosts: k3s_nodes
  become: true
  gather_facts: true
  roles:
    - role: k3s

- name: Installer et configurer les agents EDOT
  hosts: elastic_agent_nodes
  become: true
  gather_facts: true
  roles:
    - role: elastic_agent

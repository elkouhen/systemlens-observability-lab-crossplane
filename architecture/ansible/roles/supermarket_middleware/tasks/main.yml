---
- name: Créer les répertoires de logs des middlewares
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/log/mongodb, mode: '0755'}
    - {path: /var/log/kafka, mode: '0777'}
    - {path: /var/log/postgresql, mode: '0777'}

- name: Créer le fichier de log MongoDB
  ansible.builtin.file:
    path: /var/log/mongodb/mongod.log
    state: touch
    mode: '0666'
    modification_time: preserve
    access_time: preserve

- name: Déployer les middlewares du lab
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item.template }}.container.j2"
    dest: "/etc/containers/systemd/{{ item.unit }}.container"
    mode: '0644'
  register: middleware_templates
  loop:
    - {template: mongodb, unit: observability-mongodb}
    - {template: kafka, unit: observability-kafka}
    - {template: postgresql, unit: observability-postgresql}

- name: Vérifier la génération des unités Quadlet du lab
  ansible.builtin.command:
    argv: ["{{ podman_system_generator_path }}", --dryrun]
  environment:
    QUADLET_UNIT_DIRS: /etc/containers/systemd
  changed_when: false

# Images chargées depuis le cache local si possible (lab-cache), sinon tirées puis sauvegardées,
# avant tout démarrage des services (systemd tirerait sinon les images depuis le réseau).
- name: Préparer les images des middlewares
  ansible.builtin.command:
    argv: [/usr/local/sbin/lab-cache, image, "{{ item }}"]
  loop:
    - docker.io/library/postgres:17
    - docker.io/library/mongo:8.0
    - docker.io/apache/kafka:3.9.2
  register: middleware_images
  changed_when: middleware_images.stdout != 'present'
  retries: 3
  delay: 10
  until: middleware_images.rc == 0

- name: Redémarrer Kafka après modification de sa déclaration
  ansible.builtin.systemd_service:
    name: observability-kafka.service
    daemon_reload: true
    state: restarted
  when: middleware_templates.results[1].changed

- name: Redémarrer PostgreSQL après modification de sa déclaration
  ansible.builtin.systemd_service:
    name: observability-postgresql.service
    daemon_reload: true
    state: restarted
  when: middleware_templates.results[2].changed

- name: Recharger systemd pour les unités Quadlet du lab
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Démarrer les middlewares du lab
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: started
  loop: [observability-mongodb, observability-kafka, observability-postgresql]

- name: Attendre la disponibilité de Kafka métier
  ansible.builtin.command: >-
    podman exec --env KAFKA_OPTS= observability-kafka
    /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
  register: middleware_kafka_ready
  changed_when: false
  retries: 30
  delay: 3
  until: middleware_kafka_ready.rc == 0

# pg_stat_statements et compte otel du receiver PostgreSQL : déclarés dans
# platform/crossplane/postgresql/monitoring.yaml (provider-sql). Compte otel_monitor du receiver
# MongoDB : platform/crossplane/mongodb/monitoring.yaml (provider-terraform).

# Amorçage du compte administrateur MongoDB utilisé par Crossplane (provider Terraform
# Kaginari/mongodb), qui crée ensuite le compte de supervision otel_monitor
# (platform/crossplane/mongodb/monitoring.yaml). Le provider s'authentifie toujours : il ne peut
# pas créer le premier compte. MongoDB reste sans --auth.
- name: Créer le compte administrateur MongoDB de Crossplane
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - observability-mongodb
      - mongosh
      - --quiet
      - --host
      - 127.0.0.1
      - --eval
      - >-
        const admin = db.getSiblingDB('admin');
        const roles = [{role: 'userAdminAnyDatabase', db: 'admin'}, {role: 'clusterMonitor', db: 'admin'}];
        if (admin.getUser('{{ mongodb_crossplane_user }}') === null) {
          admin.createUser({user: '{{ mongodb_crossplane_user }}', pwd: '{{ mongodb_crossplane_password }}', roles: roles});
          print('created');
        } else {
          admin.updateUser('{{ mongodb_crossplane_user }}', {pwd: '{{ mongodb_crossplane_password }}', roles: roles});
          print('updated');
        }
  register: mongodb_crossplane_user_config
  changed_when: "'created' in mongodb_crossplane_user_config.stdout"
  no_log: true

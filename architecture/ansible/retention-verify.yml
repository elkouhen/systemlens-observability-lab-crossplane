---
- name: Vérifier la rétention des journaux sur les VM
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Vérifier les timers et journald
      ansible.builtin.command: systemctl is-active systemd-journald logrotate.timer observability-purge-logs.timer
      changed_when: false

    - name: Vérifier la syntaxe globale de logrotate
      ansible.builtin.command: logrotate --debug /etc/logrotate.conf
      changed_when: false

    - name: Lire le plafond journald déployé
      ansible.builtin.slurp:
        src: /etc/systemd/journald.conf.d/observability-retention.conf
      register: retention_journal

    - name: Vérifier les limites journald déclarées
      ansible.builtin.assert:
        that:
          - "'MaxRetentionSec=1day' in (retention_journal.content | b64decode)"
          - "'SystemMaxUse=256M' in (retention_journal.content | b64decode)"

    - name: Vérifier la dernière exécution du nettoyage
      ansible.builtin.command: systemctl show observability-purge-logs.service -p Result -p ExecMainStatus -p ExecMainStartTimestamp
      register: retention_cleanup_status
      changed_when: false
      failed_when: >-
        'Result=success' not in retention_cleanup_status.stdout or
        'ExecMainStatus=0' not in retention_cleanup_status.stdout or
        retention_cleanup_status.stdout is search('ExecMainStartTimestamp=($|\n)')

    - name: Lire l'occupation disque des journaux
      ansible.builtin.command: journalctl --disk-usage
      register: retention_usage
      changed_when: false

    - name: Afficher l'occupation des journaux
      ansible.builtin.debug:
        var: retention_usage.stdout

# Brokers Kafka Strimzi de k3s-01 : outils Kafka exécutés dans le pod de chaque broker (identifiant
# 0 du pool dual) ; le Kafka OTel exige l'administrateur SCRAM otel-admin.
- name: Vérifier les paramètres effectifs des brokers Kafka et des topics
  hosts: apps_nodes
  become: true
  gather_facts: false
  vars:
    kubectl_exec: [/usr/local/bin/k3s, kubectl, exec, -i, -c, kafka]
    retention_kafka_clusters:
      - {namespace: h0tl-supermarche-app, pod: supermarket-kafka-dual-0, topics: '^supermarket[.]', config: []}
      - {namespace: elastic-stack, pod: otel-kafka-dual-0, topics: '^otel-', config: [--command-config, /tmp/otel-admin.properties]}
  tasks:
    - name: Déposer la configuration cliente de l'administrateur du Kafka OTel
      ansible.builtin.shell:
        cmd: >-
          printf '%s\n' 'security.protocol=SASL_PLAINTEXT' 'sasl.mechanism=SCRAM-SHA-512'
          'sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="{{ otel_kafka_admin_username }}" password="{{ otel_kafka_admin_password }}";'
          | {{ kubectl_exec | join(' ') }} -n elastic-stack otel-kafka-dual-0 -- sh -c 'umask 077; cat > /tmp/otel-admin.properties'
      changed_when: false
      no_log: true

    - name: Lire la configuration effective des brokers
      ansible.builtin.command:
        argv: "{{ kubectl_exec + ['-n', item.namespace, item.pod, '--', '/opt/kafka/bin/kafka-configs.sh', '--bootstrap-server', 'localhost:9092'] + item.config + ['--entity-type', 'brokers', '--entity-name', '0', '--describe', '--all'] }}"
      loop: "{{ retention_kafka_clusters }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.pod }}"
      register: retention_brokers
      changed_when: false

    - name: Vérifier la rétention effective des brokers
      ansible.builtin.assert:
        that:
          - "'log.retention.hours=24 ' in item.stdout"
          - "'log.retention.bytes=536870912 ' in item.stdout"
          - "'log.cleanup.policy=delete ' in item.stdout"
          - "'log.roll.hours=1 ' in item.stdout"
      loop: "{{ retention_brokers.results }}"
      loop_control:
        label: "{{ item.item.namespace }}/{{ item.item.pod }}"

    - name: Lire les topics
      ansible.builtin.command:
        argv: "{{ kubectl_exec + ['-n', item.namespace, item.pod, '--', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092'] + item.config + ['--list'] }}"
      loop: "{{ retention_kafka_clusters }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.pod }}"
      register: retention_topics
      changed_when: false

    - name: Lire les rétentions effectives des topics métier et OTLP
      ansible.builtin.command:
        argv: "{{ kubectl_exec + ['-n', item.0.item.namespace, item.0.item.pod, '--', '/opt/kafka/bin/kafka-configs.sh', '--bootstrap-server', 'localhost:9092'] + item.0.item.config + ['--entity-type', 'topics', '--entity-name', item.1, '--describe', '--all'] }}"
      loop: "{{ retention_topics.results | subelements('stdout_lines') | selectattr('1', 'match', '^(supermarket[.]|otel-)') | list }}"
      loop_control:
        label: "{{ item.1 }}"
      register: retention_configs
      changed_when: false

    - name: Vérifier la rétention des topics métier et OTLP
      ansible.builtin.assert:
        that:
          - "'retention.ms=86400000 ' in item.stdout"
          - "'retention.bytes=536870912 ' in item.stdout"
          - "'segment.ms=3600000 ' in item.stdout"
          - "'cleanup.policy=delete ' in item.stdout"
      loop: "{{ retention_configs.results }}"
      loop_control:
        label: "{{ item.item.1 }}"

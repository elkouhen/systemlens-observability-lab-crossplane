---
# Rattachement des VM du groupe (ADR-015) : plateforme, environnement et
# Edge cible. otel_edge désigne un hôte de otel_edge_nodes, ou kafka-local
# pour l'agent qui publie directement dans le Kafka OTel local (ADR-005).
otel_platform: elk
otel_environment: homologation
otel_edge: otel-edge-01
firewall_tcp_ports: [4317, 4318]
firewall_udp_ports: []
middleware_credentials_required: false
# L'Edge ne porte aucune table de routage (ADR-020) : chaque client déclare
# platform.id et deployment.environment.name, et l'Edge publie dans le topic
# de cette plateforme si otel_platforms (group_vars/all.yml) la lui attribue.

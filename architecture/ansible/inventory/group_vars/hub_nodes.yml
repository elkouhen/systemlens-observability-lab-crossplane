---
# Hub tools-01 : Argo CD, Crossplane, cert-manager. Traefik et ServiceLB servent l'interface
# Argo CD (port 80 du nœud, transféré sur le port 8080 de l'hôte).
k3s_disable: []
# Plafond souple du tas Go du serveur k3s (rôle k3s, drop-in systemd GOMEMLIMIT) : le serveur du
# hub porte les CRD de cinq providers Crossplane et garde sinon plus de 1,5 Gio.
k3s_go_memory_limit: 1GiB

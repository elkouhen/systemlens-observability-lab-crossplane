---
# Rattachement des VM du groupe (ADR-015) : plateforme, environnement et
# Edge cible (identité du Collecteur Edge de k3s-01 dans platforms.yaml).
otel_platform: elk
otel_environment: homologation
otel_edge: otel-edge-01
# Elasticsearch, Kibana et Fleet Server (ECK) : Services LoadBalancer de ServiceLB sur 9200, 5601
# et 8220. Traefik n'est pas utilisé.
k3s_disable: [traefik]
firewall_tcp_ports: [6443, 10250, 9200, 5601, 8220]

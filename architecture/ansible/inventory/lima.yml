# Inventaire Lima : hôtes, groupes et IP privées des 3 VM du lab.
# ansible_host garde l'IP privée 192.168.33.x (utilisée par les templates) ; la connexion SSH
# passe par le port local fixe de chaque VM Lima (ssh.localPort dans lima/<vm>.yaml).
# k3s_nodes : le hub tools-01 et les deux clusters cibles k3s-01 (applicatif) et elk-01
# (observabilité, ECK) ; leurs services sont déployés par Argo CD et Crossplane depuis le hub.
---
all:
  children:
    k3s_nodes:
      children:
        hub_nodes:
          hosts:
            tools-01:
              ansible_host: 192.168.33.60
              ansible_port: 2256
              ansible_ssh_private_key_file: ~/.lima/_config/user
              node_ip: 192.168.33.60
        elk_nodes:
          hosts:
            elk-01:
              ansible_host: 192.168.33.40
              ansible_port: 2254
              ansible_ssh_private_key_file: ~/.lima/_config/user
              node_ip: 192.168.33.40
        apps_nodes:
          hosts:
            k3s-01:
              ansible_host: 192.168.33.50
              ansible_port: 2255
              ansible_ssh_private_key_file: ~/.lima/_config/user
              node_ip: 192.168.33.50
    # Agents EDOT des VM (métriques et logs de l'hôte, vers l'Edge). Le hub n'en a pas.
    elastic_agent_nodes:
      children:
        apps_nodes:
        elk_nodes:

---
- name: Appliquer uniquement la rétention des VM
  hosts: all
  become: true
  gather_facts: false
  roles:
    - retention

# La rétention des brokers Kafka (métier et OTel, Strimzi dans k3s-01) est déclarée par leur
# instance KafkaCluster (gitops/supermarket/databases.yaml, gitops/otel-pipeline/kafka.yaml), celle
# des topics par provider-kafka (kafka-topics.yaml, API OtelPlatform).

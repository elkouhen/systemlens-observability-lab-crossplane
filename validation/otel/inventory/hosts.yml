---
# Inventaire d'exemple : adapter les URL à l'environnement à valider.
all:
  children:
    otel_validation:
      children:
        otel_validation_edge:
          hosts:
            k3s-01:
              ansible_host: 127.0.0.1
              # Port SSH local de la VM Lima ; `make otel-validation`
              # remplace cette valeur avant l'exécution.
              ansible_port: 22
              ansible_user: lab
              ansible_ssh_private_key_file: ~/.lima/_config/user
              ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      vars:
        # Collecteur Edge : exécution SSH dans k3s-01, vers les ports d'hôte du pod otel-edge, comme
        # les agents EDOT des VM. Depuis le poste, http://127.0.0.1:4318 (redirection Lima de
        # k3s-01) mène au même Edge.
        otel_gateway_direct_endpoint: http://192.168.33.50:4318
        otel_service_name: otel-validation
        otel_platform: elk
        otel_deployment_environment: homologation

        # Elasticsearch porte les données affichées dans Kibana Discover.
        kibana_url: http://kibana.observability.test:5601
        elasticsearch_url: http://elasticsearch.observability.test:9200
        elasticsearch_username: elastic
        elasticsearch_password: "{{ lookup('ansible.builtin.env', 'ELASTICSEARCH_PASSWORD') }}"
        elasticsearch_validate_certs: true

        validation_index_pattern: logs-*
        validation_timeout_seconds: 90
        validation_poll_delay_seconds: 3

name: Construction des images applicatives

# Construit et publie sur GHCR les images des services Java (apps/), aux tags déclarés dans Git
# (architecture/gitops/<groupe>/application*.yaml) et sha-<commit court>. Argo CD déploie ensuite
# le tag de Git ; le poste de travail ne construit plus d'image (make images-wait attend leur
# publication). Les VM Lima sont aarch64 : construction arm64 native sur ubuntu-24.04-arm.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'architecture/gitops/supermarket/applications.yaml'
      - 'architecture/gitops/demo-api/application.yaml'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/elkouhen/systemlens-observability-lab-crossplane

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5.0.0

      - name: Installer Java 21
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tester supermarket-demo
        run: mvn --batch-mode verify -f apps/supermarket-demo/pom.xml

      - name: Tester demo-api
        run: mvn --batch-mode verify -f apps/demo-api/pom.xml

  build:
    needs: verify
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: order-service, context: apps/supermarket-demo, manifest: architecture/gitops/supermarket/applications.yaml}
          - {image: inventory-service, context: apps/supermarket-demo, manifest: architecture/gitops/supermarket/applications.yaml}
          - {image: restock-service, context: apps/supermarket-demo, manifest: architecture/gitops/supermarket/applications.yaml}
          - {image: demo-api, context: apps/demo-api, manifest: architecture/gitops/demo-api/application.yaml}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5.0.0

      - name: Lire le tag déclaré dans Git
        id: tag
        run: |
          tag="$(sed -n "s/.*image: {name: ${{ matrix.image }}, tag: \([^}]*\)}.*/\1/p" '${{ matrix.manifest }}')"
          test -n "$tag" || { echo "Tag de ${{ matrix.image }} introuvable dans ${{ matrix.manifest }}" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Se connecter à GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier ${{ matrix.image }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.image }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
